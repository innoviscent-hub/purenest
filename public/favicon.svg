<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rounded square background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2b5e" />
      <stop offset="100%" stop-color="#1a3f7a" />
    </linearGradient>
    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a6b2f" />
      <stop offset="50%" stop-color="#2db84a" />
      <stop offset="100%" stop-color="#5fd87a" />
    </linearGradient>
    <!-- Wave/hand gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a2f6e" />
      <stop offset="60%" stop-color="#1558b0" />
      <stop offset="100%" stop-color="#3a82d8" />
    </linearGradient>
    <!-- House gradient -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2b5e" />
      <stop offset="100%" stop-color="#1a3f7a" />
    </linearGradient>
    <!-- Sparkle gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="100%" stop-color="#1a88e0" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <!-- Scale and center the emblem (100x100 viewbox → 420x420 within 512x512) -->
  <g transform="translate(46, 46) scale(4.2)">

    <!-- 1. Green leaf arc (left side) -->
    <path
      d="M 48 82 C 20 75, 12 38, 46 10 C 34 28, 28 55, 44 78 Z"
      fill="url(#leafGrad)"
    />

    <!-- 2. Blue wave / hand (bottom-right) -->
    <path
      d="M 44 78 C 54 92, 76 90, 86 72 C 93 57, 94 38, 88 28
         C 86 50, 73 66, 56 66 C 49 66, 43 63, 44 78 Z"
      fill="url(#waveGrad)"
    />

    <!-- 3. Chimney -->
    <rect x="67" y="25" width="5" height="13" rx="1" fill="url(#houseGrad)" />

    <!-- 4. Roof -->
    <path d="M 57 18 L 33 40 L 38 45 L 57 27 L 76 45 L 81 40 Z"
      fill="url(#houseGrad)" />

    <!-- 5. House body (white) -->
    <path d="M 42 40 L 72 40 L 72 62 C 67 65, 58 65.5, 42 62 Z" fill="#ffffff" />

    <!-- 6. Window panes (2x2) -->
    <rect x="51" y="46" width="4" height="4" rx="0.5" fill="url(#waveGrad)" />
    <rect x="57" y="46" width="4" height="4" rx="0.5" fill="url(#waveGrad)" />
    <rect x="51" y="52" width="4" height="4" rx="0.5" fill="url(#waveGrad)" />
    <rect x="57" y="52" width="4" height="4" rx="0.5" fill="url(#waveGrad)" />

    <!-- 7. Sparkle stars (top-right) -->
    <path d="M 79 8 Q 79 13 84 13 Q 79 13 79 18 Q 79 13 74 13 Q 79 13 79 8 Z"
      fill="url(#sparkleGrad)" />
    <path d="M 70 16 Q 70 20 74 20 Q 70 20 70 24 Q 70 20 66 20 Q 70 20 70 16 Z"
      fill="#4fc3f7" />
    <path d="M 85 20 Q 85 23 88 23 Q 85 23 85 26 Q 85 23 82 23 Q 85 23 85 20 Z"
      fill="url(#sparkleGrad)" />

  </g>
</svg>
